  Sao y LUỒNG + CÂU CHỮ của theoneai.onrender.com (chị Linh chốt 02/09/2026):
  bản tiếng Anh giữ nguyên văn, bản tiếng Việt (file này) dịch ra từ đó.

  LUỒNG 6 MÀN (giống bản gốc):
   1. Trợ lý chào + hỏi ảnh cảm hứng (Tải ảnh / Xem thư viện / Bỏ qua)
   2. "Kể cho tôi nghe về chiếc váy bạn hằng mơ..." (gõ tự do / Bỏ qua)
   3. Thẻ "Đặc điểm chiếc váy trong mơ của bạn" (4 ý) + "Đúng ý bạn chưa?"
   4. Chọn thuộc tính: Silhouette / Neckline / Fabric / Color (có Flexible)
   5. "Bạn còn mong muốn gì thêm không?" (gõ tự do / Bỏ qua)
   6. Kết quả: bản phác thảo + tóm tắt + CTA

  KHÁC BẢN GỐC CÓ CHỦ Ý (chị Linh đã chốt):
   - KHÔNG bắt đăng nhập (bản gốc bắt tạo tài khoản) — khách vào là làm ngay.
   - KHÔNG nêu giá (bản gốc ghi "từ $2,990") — luật DLA: không báo giá tự động.
   - KHÔNG có AI vẽ ảnh váy thật & thử váy lên ảnh khách — 2 phần đó bắt buộc
     trả phí (~1.000-1.500đ/ảnh). Chị Linh chốt CHỈ LÀM PHẦN MIỄN PHÍ trước.

  .lc{border:1.5px solid var(--nau);border-radius:10px;padding:15px 20px;text-align:left;
      font-size:15.5px;color:var(--ink);background:#fff;transition:background .2s,color .2s}
  .lc:hover{background:var(--nau);color:#fff}
  .lc.chon{background:var(--nau);color:#fff}

  /* ── ô gõ chữ ────────────────────────────────────── */

    padding:14px 16px;border:1.5px solid var(--hair);border-radius:12px;color:var(--ink);
  }

  .the-dd .so{font-weight:700;font-size:.85rem;color:#fff;flex:none;

function chonBanVe(){
  var tot = null, diemTot = 0;
  for (var i = 0; i < BAN_VE.length; i++) {
    var b = BAN_VE[i], diem = 0;
    if (b.d) { if (b.d === s.chon.silhouette) diem += 10; else continue; }
    if (b.c && b.c === s.chon.neckline) diem += 4;
    if (b.l && b.l === s.chon.fabric)   diem += 3;
    if (diem > diemTot) { diemTot = diem; tot = b; }

  return tot ? ("anh/sketch/" + tot.f) : null;
}

/* ═════════ VẼ VÁY (SVG phác thảo) ═════════ */
function cong(pts){
  var o="";
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    o+=" C "+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+","+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)
      +" "+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+","+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)
      +" "+p2[0].toFixed(1)+","+p2[1].toFixed(1);
  }
  return o;
}
function duongVay(rows){
  var tr = rows.map(function(r){return [160-r[1], r[0]];});
  var ph = rows.map(function(r){return [160+r[1], r[0]];}).reverse();
  return "M "+tr[0][0].toFixed(1)+","+tr[0][1].toFixed(1)+cong(tr)
       +" L "+ph[0][0].toFixed(1)+","+ph[0][1].toFixed(1)+cong(ph)+" Z";
}
function timOpt(key, id){
  var n = NHOM.filter(function(x){return x.key===key;})[0];
  return n ? n.opts.filter(function(o){return o.id===id;})[0] : null;
}
function rowsCua(id){
  var o = timOpt("silhouette", id);
  return (o && o.rows) ? o.rows : timOpt("silhouette","A-Line").rows;
}
function mauCua(id){
  var o = timOpt("color", id);
  return (o && o.hex) ? o.hex : "#F6EFE4";
}

/* ═════════ GỌI AI (Gemini qua Apps Script) ═════════ */
function goiAI(moTa, xong){
  if(!AI_URL){ xong(null); return; }
  var u = AI_URL + (AI_URL.indexOf("?")>-1 ? "&" : "?") + "mota=" + encodeURIComponent(moTa);
  var het = setTimeout(function(){ het=null; xong(null); }, 20000);
  fetch(u).then(function(r){ return r.json(); }).then(function(j){
    if(!het) return; clearTimeout(het);
    if(j && j.ok && j.goiY) xong(j.goiY); else xong(null);
  }).catch(function(){ if(het){ clearTimeout(het); xong(null); } });
}
/* Chỉ nhận giá trị nằm trong danh sách cho phép — tránh AI bịa tên lạ */
function apGoiY(g){
  if(!g) return;
  NHOM.forEach(function(n){
    var v = g[n.key];
    if(v && n.opts.some(function(o){ return o.id===v; })) s.chon[n.key] = v;
  });
  luu();
}

                 + esc(n.ten)+'</b>'+esc(tenVi(n.key))+'</span></li>';
          }).join('')
        + '</ol></div>'
    + '</div>'
    + '<div class="cta-hop">'
      + '<h2>'+esc(L.chuaCo)+'</h2><p>'+esc(L.chuaCo_p)+'</p>'
      + '<p class="cta-nhan">'+esc(L.sanSang)+'</p>'
      + '<button class="cta-d" data-di="datLich"><span class="ic">📅</span><span><b>'+esc(L.cta1_b)+'</b><span>'+esc(L.cta1_s)+'</span></span></button>'
      + '<button class="cta-d" data-di="xinGia"><span class="ic">💌</span><span><b>'+esc(L.cta2_b)+'</b><span>'+esc(L.cta2_s)+'</span></span></button>'
      + '<p class="cta-nhan">'+esc(L.chuaSan)+'</p>'
      + '<button class="cta-d" data-di="lamLaiHet"><span class="ic">🔄</span><span><b>'+esc(L.cta3_b)+'</b></span></button>'
      + '<button class="cta-d" data-di="luuTK"><span class="ic">💾</span><span><b>'+esc(L.cta4_b)+'</b></span></button>'
    + '</div>';
}

/* ═════════ THƯ VIỆN & UPLOAD (hộp phụ) ═════════ */
function moThuVien(){
  var c = $("#noidung");
  c.innerHTML = '<div class="bb"><b>'+esc(L.tvTieuDe)+'</b><br>'+esc(L.tvMoTa)+'</div>'
    + '<div class="tv-luoi">'
    + THU_VIEN.map(function(a){
        var on = s.anh.indexOf(a)>-1;
        return '<div class="tv-o'+(on?" chon":"")+'" data-tv="'+a+'"><img src="'+a+'" alt=""><span class="tick">✓</span></div>';
      }).join('')
    + '</div>'
    + '<button class="nut" data-di="tvXong">'+esc(L.tvXong)+' ('+s.anh.length+'/3)</button>';
}
function moTaiAnh(){
  var c = $("#noidung");
  var xem = s.anh.length
    ? '<div class="up-xem">'+s.anh.map(function(a,i){
        return '<figure><img src="'+a+'"><button type="button" data-xoa-anh="'+i+'">×</button></figure>';
      }).join('')+'</div>' : '';
  c.innerHTML = '<div class="bb">'+esc(L.hoiAnh)+'</div>'
    + '<div class="up-hop"><label class="lbl" for="f-anh">'+esc(L.upLbl)+'</label>'
    + '<input type="file" id="f-anh" accept="image/*" multiple><p>'+esc(L.upGhi)+'</p>'+xem+'</div>'
    + '<button class="nut" data-di="tvXong">'+esc(L.upXong)+'</button>';
  var f = $("#f-anh");
  if(f) f.addEventListener("change", function(ev){
    var fs = Array.prototype.slice.call(ev.target.files||[]).slice(0, 3-s.anh.length);
    var con = fs.length;
    if(!con) return;
    fs.forEach(function(file){
      nenAnh(file, function(url){ s.anh.push(url); if(--con===0) moTaiAnh(); });
    });
  });
}
function nenAnh(file, xong){
  var fr = new FileReader();
  fr.onload = function(e){
    var im = new Image();
    im.onload = function(){
      var k = Math.min(1, 560/im.width);
      var cv = document.createElement("canvas");
      cv.width = Math.round(im.width*k); cv.height = Math.round(im.height*k);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      xong(cv.toDataURL("image/jpeg", .72));
    };
    im.src = e.target.result;
  };
  fr.readAsDataURL(file);
}

/* ═════════ FORM GỬI LEAD ═════════ */
function tomTat(){
  var d = NHOM.map(function(n){
    var o = timOpt(n.key, s.chon[n.key]);
    return n.ten+": "+(o ? o.id : "—");
  });
  var t = "THIET KE VAY | Ma: "+maTK()+" | "+d.join(" / ");
  if(s.moTa) t += " | Mo ta: "+s.moTa.slice(0,200);
  if(s.themGi) t += " | Them: "+s.themGi.slice(0,200);
  if(s.anh.length) t += " | Co "+s.anh.length+" anh cam hung";
  return t;
}
function moForm(loai){
  var c = $("#noidung");
  var tieu = loai==="datLich" ? L.cta1_b : L.cta2_b;
  c.innerHTML = '<div class="bb"><b>'+esc(tieu)+'</b></div>'
    + '<form id="fm" style="max-width:520px">'
    + '<div style="display:grid;gap:14px">'
    + o("ten","Full name", "text", true)
    + o("sdt","Phone / WhatsApp", "tel", true)
    + o("email","Email (optional)", "email", false)
    + o("ngay","Wedding date", "date", false)
    + '<label style="display:grid;gap:5px"><span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)">Wedding city</span>'
    + '<select name="tp" style="font:inherit;font-size:15px;padding:11px 12px;border:1.5px solid var(--hair);border-radius:10px">'
    + '<option>Hanoi</option><option>Ho Chi Minh City</option><option>Elsewhere</option></select></label>'
    + '</div>'
    + '<button class="nut" type="submit" style="width:100%;margin-top:20px">Send to Dolinhanh</button>'
    + '</form>'
    + '<p style="font-size:12.5px;color:var(--grey-2);margin-top:14px;max-width:520px">Dolinhanh will get in touch to advise you. No automatic charges.</p>'
    + '<button class="bo-qua" style="margin-top:16px" data-di="veKQ">\u2190 Back to my design</button>';

  function o(name,nhan,type,bat){
    return '<label style="display:grid;gap:5px"><span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)">'
      + esc(nhan)+'</span><input name="'+name+'" type="'+type+'"'+(bat?" required":"")
      + ' style="font:inherit;font-size:15px;padding:11px 12px;border:1.5px solid var(--hair);border-radius:10px"></label>';
  }

  $("#fm").addEventListener("submit", function(e){
    e.preventDefault();
    var f = new FormData(e.target);
    try{
      var fd = new FormData();
      fd.append("entry.1614276000", f.get("ten"));
      fd.append("entry.379034013", f.get("sdt"));
      fd.append("entry.541722676", tomTat()+" | TP: "+f.get("tp")
        +" | Ngay cuoi: "+(f.get("ngay")||"chua chon")
        +" | Email: "+(f.get("email")||"-")
        +" | Loai: "+(loai==="datLich"?"Dat lich tu van":"Xin bao gia"));
      fetch("https://docs.google.com/forms/d/e/"+FORM_ID+"/formResponse",
            {method:"POST", mode:"no-cors", body:fd}).catch(function(){});
    }catch(err){}
    $("#noidung").innerHTML = '<div class="bb"><b>Dolinhanh has received your design.</b><br>'
      + 'Our bridal team will be in touch shortly. You can also message us on WhatsApp for a faster reply.</div>'
      + '<a class="nut" href="'+ZALO+'" target="_blank" rel="noopener">Message us now</a>'
      + (s.anh.length ? '<p style="font-size:13.5px;color:var(--grey);margin-top:16px;max-width:560px">Bạn có '
          +s.anh.length+' ảnh cảm hứng — nhắn kèm ảnh đó qua Zalo để tư vấn viên hiểu đúng ý bạn hơn nhé.</p>' : '');
  });
}

/* ═════════ ĐIỀU HƯỚNG ═════════ */
document.addEventListener("click", function(e){
  var tv = e.target.closest("[data-tv]");
  if(tv){
    var a = tv.dataset.tv, i = s.anh.indexOf(a);
    if(i>-1) s.anh.splice(i,1);
    else if(s.anh.length<3) s.anh.push(a);
    moThuVien(); return;
  }
  var xa = e.target.closest("[data-xoa-anh]");
  if(xa){ s.anh.splice(+xa.dataset.xoaAnh,1); ve(); return; }

  var pill = e.target.closest("[data-nhom]");
  if(pill){
    var k = pill.dataset.nhom;
    s.chon[k] = (s.chon[k]===pill.dataset.id) ? null : pill.dataset.id;
    luu(); ve(); return;
  }

  var b = e.target.closest("[data-di]");
  if(!b) return;
  var d = b.dataset.di;

  if(d==="tai"){ moTaiAnh(); return; }
  if(d==="thuvien"){ moThuVien(); return; }
  if(d==="tvXong"){ ve(); return; }

  if(d==="tiep0"){ s.man = AI_URL ? 1 : 3; ve(); return; }

  if(d==="guiMoTa"){
    var t = ($("#o-mota")||{}).value || "";
    s.moTa = t.trim();
    if(!s.moTa){ s.man = 3; ve(); return; }
    s.man = 2; s.dacDiem = null; ve();
    goiAI(s.moTa, function(g){
      if(g){ s.dacDiem = g; apGoiY(g); ve(); }
      else { s.man = 3; ve(); }
    });
    return;
  }
  if(d==="boMoTa"){ s.man = 3; ve(); return; }
  if(d==="tiep2"){ s.man = 3; ve(); return; }
  if(d==="lamLai2"){ s.man = 1; ve(); return; }
  if(d==="tiep3" || d==="bo3"){ s.man = 4; ve(); return; }

  if(d==="guiThem"){ s.themGi = (($("#o-them")||{}).value||"").trim(); s.man = 5; ve(); return; }
  if(d==="boThem"){ s.man = 5; ve(); return; }

  if(d==="datLich"){ moForm("datLich"); return; }
  if(d==="xinGia"){ moForm("xinGia"); return; }
  if(d==="veKQ"){ s.man = 5; ve(); return; }
  if(d==="lamLaiHet"){ s.man = 3; ve(); return; }
  if(d==="luuTK"){
    try{
      var ds = JSON.parse(localStorage.getItem("dla_tkv_daluu")||"[]");
      ds.push({ma:maTK(), chon:s.chon, moTa:s.moTa, themGi:s.themGi});
      localStorage.setItem("dla_tkv_daluu", JSON.stringify(ds));
    }catch(err){}
    var old = b.querySelector("b").textContent;
    b.querySelector("b").textContent = L.daLuu;
    setTimeout(function(){ b.querySelector("b").textContent = old; }, 1800);
    return;
  }
});

ve();
})();
</script>
