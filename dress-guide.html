<body>
<title>The Bride's Dress Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap">

<style>
  :root{
    --nen:#EFE9E5;
    --vien:#DFD5D0;
    --muc:#241B19;
    --ghi:#8B7B77;
    --hong:#F0BDB8;
    --hong-chu:#B05A55;
    --serif:"Playfair Display",Georgia,serif;
    --sans:"Be Vietnam Pro",-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --nen:#191513; --vien:#2E2724; --muc:#F2EBE8; --ghi:#A2938F; --hong-chu:#E0A9A3; }
  }
  :root[data-theme="dark"]{ --nen:#191513; --vien:#2E2724; --muc:#F2EBE8; --ghi:#A2938F; --hong-chu:#E0A9A3; }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--nen);color:var(--muc);
    font-family:var(--sans);font-weight:300;
    height:100vh;display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px clamp(14px,3vw,28px);flex:none}
  .ten{display:grid;gap:2px;min-width:0}
  .ten span{font-size:.6rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--hong-chu)}
  .ten b{font-family:var(--serif);font-weight:400;font-size:clamp(.95rem,2vw,1.18rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cong-cu{display:flex;gap:8px;flex:none}
  .nut-tron{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--vien);background:transparent;
    color:var(--muc);cursor:pointer;display:grid;place-items:center;font-size:15px;line-height:1;
    font-family:var(--sans);transition:background .2s,border-color .2s;
  }
  .nut-tron:hover{background:var(--vien)}
  .nut-tron:focus-visible{outline:2px solid var(--hong-chu);outline-offset:2px}

  .san{flex:1;display:grid;place-items:center;padding:0 clamp(10px,2vw,26px);min-height:0;position:relative}

  .khung{position:relative}
  .sach{position:absolute;left:0;top:0;z-index:2;perspective:2600px;transform-style:preserve-3d}
  .nen-trai{position:absolute;left:0;top:0;width:50%;height:100%;background:#FFFFFF;box-shadow:inset -14px 0 22px -18px rgba(36,27,25,.5);z-index:0}
  .to{
    position:absolute;top:0;left:50%;width:50%;height:100%;
    transform-origin:left center;transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.36,.06,.2,1);
  }
  .mat{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fff}
  .mat img{width:100%;height:100%;display:block;object-fit:cover;-webkit-user-drag:none;user-select:none;pointer-events:none}
  .mat.sau{transform:rotateY(180deg)}
  .mat.truoc::after{content:"";position:absolute;left:0;top:0;bottom:0;width:24px;background:linear-gradient(90deg,rgba(36,27,25,.14),transparent);pointer-events:none}
  .mat.sau::after{content:"";position:absolute;right:0;top:0;bottom:0;width:24px;background:linear-gradient(270deg,rgba(36,27,25,.14),transparent);pointer-events:none}
  .bong{position:absolute;inset:0;box-shadow:0 20px 55px rgba(36,27,25,.2);pointer-events:none;z-index:1}
  .dau-mo{position:absolute;inset:0;pointer-events:none;z-index:3;background-repeat:no-repeat;background-position:center;background-size:88% auto}

  /* một trang — điện thoại */
  .don{position:relative;background:#fff;box-shadow:0 16px 44px rgba(36,27,25,.2);overflow:hidden;display:none}
  .don img{width:100%;height:100%;display:block;object-fit:cover;transition:opacity .28s;-webkit-user-drag:none;user-select:none;pointer-events:none}
  body.mot .sach{display:none}
  body.mot .don{display:block}

  .mui{
    position:absolute;top:50%;transform:translateY(-50%);z-index:60;
    width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.92);color:#241B19;font-size:18px;line-height:1;
    box-shadow:0 4px 16px rgba(36,27,25,.22);display:grid;place-items:center;transition:transform .2s,opacity .2s;
  }
  .mui:hover{transform:translateY(-50%) scale(1.07)}
  .mui:disabled{opacity:.25;cursor:default}
  .mui.lui{left:clamp(-21px,-2vw,-6px)}
  .mui.toi{right:clamp(-21px,-2vw,-6px)}
  @media(max-width:700px){.mui.lui{left:6px}.mui.toi{right:6px}}

  .duoi{
    flex:none;display:flex;align-items:center;justify-content:center;gap:16px;
    padding:11px 18px 16px;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ghi);
  }
  .duoi .so{font-family:var(--serif);font-size:.95rem;letter-spacing:.06em;color:var(--muc);min-width:78px;text-align:center}
  .thanh{width:min(260px,38vw);height:2px;background:var(--vien);position:relative;border-radius:2px}
  .thanh i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hong-chu);border-radius:2px;transition:width .4s}

  .luoi{position:fixed;inset:0;background:var(--nen);z-index:90;overflow-y:auto;padding:clamp(16px,3vw,32px);display:none}
  .luoi.hien{display:block}
  .luoi .dau{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .luoi .dau b{font-family:var(--serif);font-weight:400;font-size:1.1rem}
  .luoi .o{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
  .luoi button.trang{
    border:1px solid var(--vien);background:#fff;padding:0;cursor:pointer;overflow:hidden;
    display:grid;transition:transform .18s,border-color .2s;
  }
  .luoi button.trang:hover{transform:translateY(-3px);border-color:var(--hong-chu)}
  .luoi button.trang img{width:100%;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
  .luoi button.trang span{font-size:.58rem;letter-spacing:.14em;color:var(--ghi);padding:5px 0;background:var(--nen)}


  /* ── điểm bấm trên trang ────────────────────────────── */
  .diem{
    position:absolute;border:0;padding:0;cursor:pointer;background:rgba(240,189,184,.26);
    border-bottom:1.5px solid var(--hong-chu);border-radius:2px;z-index:8;
  }
  .diem:hover{background:rgba(240,189,184,.55)}
  .chu-thich{
    display:none;align-items:center;gap:7px;font-size:.64rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ghi);
  }
  .chu-thich.hien{display:inline-flex}
  @media(max-width:700px){#tong{display:none}.duoi{gap:12px}}
  .chu-thich i{width:22px;height:9px;border-radius:2px;background:rgba(240,189,184,.5);border-bottom:1.5px solid var(--hong-chu)}
  .diem:focus-visible{outline:2px solid var(--hong-chu);outline-offset:2px}

  .hop-nen{
    position:fixed;inset:0;z-index:120;background:rgba(36,27,25,.55);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .hop-nen.hien{display:flex}
  .hop-noi{
    background:#fff;color:#241B19;border-radius:14px;max-width:680px;width:100%;
    max-height:88vh;overflow-y:auto;padding:clamp(20px,3vw,30px);position:relative;
    box-shadow:0 24px 60px rgba(36,27,25,.3);
  }
  .hop-noi img{width:100%;height:auto;border-radius:8px;margin-bottom:18px;display:block}
  .hop-noi .nhan-h{font-family:var(--sans);font-size:.62rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#B05A55}
  .hop-noi h3{margin:6px 0 0;font-family:var(--serif);font-weight:400;font-size:1.32rem;color:#241B19}
  .hop-noi p{margin:12px 0 0;font-size:.94rem;line-height:1.7;color:#4C3E3B}
  .hop-noi .di-trang{
    margin-top:18px;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;
    background:#F0BDB8;color:#241B19;font-family:var(--sans);font-size:.7rem;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;padding:11px 20px;border-radius:999px;
  }
  .hop-dong{
    position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
    border:1px solid #EEDFDB;background:#fff;color:#241B19;cursor:pointer;font-size:14px;line-height:1;
  }

  /* ── trắc nghiệm đọc vị gu (làm ngay trong sách) ────── */
  .qz-cau{margin-top:18px}
  .qz-cau > b{display:block;font-family:var(--serif);font-weight:400;font-size:1.02rem;color:#241B19;margin-bottom:8px}
  .qz-dap{display:grid;gap:6px}
  .qz-dap button{
    display:flex;align-items:baseline;gap:8px;text-align:left;width:100%;cursor:pointer;
    border:1px solid #EEDFDB;background:#fff;color:#4C3E3B;border-radius:10px;
    padding:9px 12px;font-family:var(--sans);font-size:.88rem;line-height:1.5;
  }
  .qz-dap button i{font-style:normal;font-weight:600;color:#B05A55;flex:none}
  .qz-dap button.chon{background:#FDF0EE;border-color:#B05A55;color:#241B19}
  .qz-kq{margin-top:20px;background:#FCF4EA;border-radius:10px;padding:16px 18px;font-size:.92rem;line-height:1.65;color:#4C3E3B}
  .qz-kq .nhan-h{display:block;margin-bottom:6px}
  .qz-kq h4{margin:0 0 6px;font-family:var(--serif);font-weight:400;font-size:1.25rem;color:#241B19}
  .qz-lam-lai{margin-top:14px;background:none;border:0;cursor:pointer;color:#8B7B77;font-family:var(--sans);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;padding:0}

  /* ── đọc to: phóng trang để đọc trên điện thoại ────── */

<script>
(function(){
  var HEP = window.innerWidth <= 700;
  var CO_DT = !!(window.__ANH_DT__ && window.__ANH_DT__.length);
  var DUNG_DT = HEP && CO_DT;                 /* bản in riêng cho điện thoại */
  var ANH = DUNG_DT ? window.__ANH_DT__ : (window.__ANH__ || []);
  var N = ANH.length;
  var SO_TO = Math.ceil(N / 2);
  var TI = DUNG_DT ? (window.__TI_DT__ || 1.777) : (window.__TI__ || 1.25);

  var sach = document.getElementById('sach');
  var khung = document.getElementById('khung');
  var don = document.getElementById('don');
  var anhDon = document.getElementById('anh-don');
  var chiSo = document.getElementById('chi-so');
  var vach = document.getElementById('vach');
  var bLui = document.getElementById('lui');
  var bToi = document.getElementById('toi');

  var vi = 0;      /* số tờ đã lật — chế độ 2 trang */
  var p = 0;       /* trang đang xem (0-based) — chế độ 1 trang */
  var mot = false; /* đang ở chế độ 1 trang */

  /* dựng các tờ */
  var html = '';
  for (var k = 0; k < SO_TO; k++){
    var a = ANH[2*k], b = ANH[2*k+1];
    html += '<div class="to" data-k="'+k+'">'
          +   '<div class="mat truoc"><img data-src="'+a+'" alt="Trang '+(2*k+1)+'"></div>'
          +   '<div class="mat sau">' + (b ? '<img data-src="'+b+'" alt="Trang '+(2*k+2)+'">' : '') + '</div>'
          + '</div>';
  }
  sach.insertAdjacentHTML('beforeend', html);
  var to = [].slice.call(sach.querySelectorAll('.to'));

  /* ── dấu mờ theo tên khách: dress-guide.html?k=Ten%20Khach ── */
  function locChu(t){
    return String(t).replace(/[<>&"']/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60);
  }
  var thamSo = new URLSearchParams(location.search);
  var TEN  = locChu(thamSo.get('k') || thamSo.get('ten') || 'Dolinhanh & Nupakachi');
  var DUOI = locChu(thamSo.get('sdt') || '0359 950 588');
  function nenDauMo(){
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">'
            + '<g transform="rotate(-32 320 320)">'
            + '<text x="320" y="300" text-anchor="middle" '
            + 'font-family="Playfair Display, Georgia, serif" font-size="44" '
            + 'letter-spacing="9" fill="#241B19" fill-opacity="0.07">' + TEN + '</text>'
            + '<text x="320" y="346" text-anchor="middle" '
            + 'font-family="Be Vietnam Pro, Helvetica, Arial, sans-serif" font-size="26" '
            + 'letter-spacing="7" fill="#241B19" fill-opacity="0.07">' + DUOI + '</text></g></svg>';
    return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg).replace(/'/g, '%27') + '")';
  }
  var NEN_DAU = nenDauMo();
  function datDauMo(el){
    if (!el || el.querySelector('.dau-mo')) return;
    var l = document.createElement('div');
    l.className = 'dau-mo';
    l.style.backgroundImage = NEN_DAU;
    el.appendChild(l);
  }

  /* ── điểm bấm ── */
  var DIEM = DUNG_DT ? (window.__DIEM_DT__ || []) : (window.__DIEM__ || []);
  var hopNen = document.getElementById('hop-nen');

  function moHop(d){
    if (d.quiz){ moQuiz(); return; }
    var anh = document.getElementById('hop-anh');
    if (d.anh){ anh.src = d.anh; anh.hidden = false; } else { anh.hidden = true; anh.removeAttribute('src'); }
    document.getElementById('hop-nhan').textContent = d.nhan || 'Xem thêm';
    document.getElementById('hop-ten').textContent = d.ten;
    document.getElementById('hop-mo').textContent = d.mo;
    var nut = document.getElementById('hop-di');
    if (d.lien){
      nut.hidden = false;
      nut.textContent = d.nutChu || 'Mở liên kết';
      nut.onclick = function(){ window.open(d.lien, '_blank', 'noopener'); };
    } else if (d.toi){
      nut.hidden = false;
      nut.textContent = 'Mở trang ' + (d.toi < 10 ? '0' : '') + d.toi;
      nut.onclick = function(){
        if (mot) p = d.toi - 1; else vi = Math.floor(d.toi / 2);
        hopNen.classList.remove('hien'); ve();
      };
    } else { nut.hidden = true; }
    hopNen.classList.add('hien');
  }
  function datDiem(el, soTrang){
    DIEM.filter(function(d){ return d.p === soTrang; }).forEach(function(d){
      var b = document.createElement('button');
      b.className = 'diem';
      b.style.cssText = 'left:' + (d.x*100) + '%;top:' + (d.y*100) + '%;width:' + (d.w*100) + '%;height:' + (d.h*100) + '%';
      b.setAttribute('aria-label', d.ten);
      b.addEventListener('click', function(e){ e.stopPropagation(); moHop(d); });
      el.appendChild(b);
    });
  }
  to.forEach(function(el, k){
    var truoc = el.querySelector('.mat.truoc');
    datDauMo(truoc);
    datDiem(truoc, 2*k + 1);
    var sau = el.querySelector('.mat.sau');
    if (sau && sau.querySelector('img')){ datDauMo(sau); datDiem(sau, 2*k + 2); }
  });
  datDauMo(document.getElementById('don'));
  /* ── đọc to ── */
  var phong = document.getElementById('phong');
  var phCuon = document.getElementById('phong-cuon');
  var phAnh = document.getElementById('phong-anh');
  var mucPhong = [1, 1.6, 2.4, 3.4], iPhong = 1, trangPhong = 0;

  function veoPhong(){
    var w = phCuon.clientWidth || window.innerWidth;
    phAnh.style.width = Math.round(w * mucPhong[iPhong]) + 'px';
    document.getElementById('ph-so').textContent = trangPhong === 0 ? 'Bìa' : hai(trangPhong + 1);
    document.getElementById('ph-lui').disabled = trangPhong === 0;
    document.getElementById('ph-toi').disabled = trangPhong >= N - 1;
    document.getElementById('ph-nho').disabled = iPhong === 0;
    document.getElementById('ph-to').disabled = iPhong === mucPhong.length - 1;
  }
  function moPhong(t){
    trangPhong = Math.max(0, Math.min(N - 1, t));
    phAnh.src = ANH[trangPhong];
    phong.classList.add('hien');
    /* chọn mức phóng sao cho trang rộng khoảng 900px — cỡ chữ đọc thoải mái */
    var w = phCuon.clientWidth || window.innerWidth;
    iPhong = 0;
    while (iPhong < mucPhong.length - 1 && w * mucPhong[iPhong] < 900) iPhong++;
    veoPhong();
    phCuon.scrollTop = 0; phCuon.scrollLeft = 0;
  }
  function diPhong(b){
    var t = Math.max(0, Math.min(N - 1, trangPhong + b));
    if (t === trangPhong) return;
    trangPhong = t; phAnh.src = ANH[t]; veoPhong(); phCuon.scrollTop = 0;
  }
  document.getElementById('nut-doc').addEventListener('click', function(){
    moPhong(mot ? p : (vi === 0 ? 0 : 2 * vi));
  });
  document.getElementById('ph-dong').addEventListener('click', function(){
    phong.classList.remove('hien');
    if (mot) { p = trangPhong; } else { vi = Math.floor((trangPhong + 1) / 2); }
    ve();
  });
  document.getElementById('ph-lui').addEventListener('click', function(){ diPhong(-1); });
  document.getElementById('ph-toi').addEventListener('click', function(){ diPhong(1); });
  document.getElementById('ph-to').addEventListener('click', function(){
    if (iPhong < mucPhong.length - 1){ iPhong++; veoPhong(); } });
  document.getElementById('ph-nho').addEventListener('click', function(){
    if (iPhong > 0){ iPhong--; veoPhong(); } });
  window.addEventListener('resize', function(){ if (phong.classList.contains('hien')) veoPhong(); });

  document.getElementById('hop-dong').addEventListener('click', function(){ hopNen.classList.remove('hien'); });
  hopNen.addEventListener('click', function(e){ if (e.target === hopNen) hopNen.classList.remove('hien'); });

  /* ── trắc nghiệm đọc vị gu ── */
  var QZ_NEN = document.getElementById('qz-nen');
  var QZ = [
    {q:'1. Mở tủ đồ ngày thường của bạn — đồ nào nhiều nhất?',
     a:['Đồ trơn màu trung tính, ít hoạ tiết','Váy điệu, chi tiết nổi bật, có chút lấp lánh','Váy hoa nhí, chất vải mềm, bay','Đồ ôm dáng, tôn đường cong']},
    {q:'2. Bạn hay lưu ảnh cưới kiểu nào trên Pinterest, Instagram?',
     a:['Cô dâu Hàn, satin trơn, tối giản','Váy tùng xoè lộng lẫy giữa sảnh lớn','Cô dâu giữa vườn, voan bay trong nắng','Váy đuôi cá ôm sát, lưng khoét sâu']},
    {q:'3. Tiệc cưới trong mơ của bạn diễn ra ở đâu?',
     a:['Tiệc thân mật, ấm cúng, tinh tế','Sảnh khách sạn lớn, sân khấu rực rỡ','Ngoài trời — sân vườn, biển, hoàng hôn','Tiệc tối sang trọng, ánh đèn vàng']},
    {q:'4. Trang sức ngày cưới, bạn chọn gì?',
     a:['Ngọc trai nhỏ, hoặc chỉ một đôi bông tai','Vương miện và đá lấp lánh','Hoa tươi và voan mỏng cài tóc','Một món thật nổi bật, còn lại bỏ hết']},
    {q:'5. Bạn muốn khách thốt lên câu nào khi bạn bước vào?',
     a:['“Sang quá.”','“Đúng là công chúa.”','“Như bước ra từ giấc mơ.”','“Quyến rũ quá.”']},
    {q:'6. Bạn sợ nhất điều gì khi mặc váy cưới?',
     a:['Trông cố quá, không giống mình','Trông đơn giản quá, thiếu lộng lẫy','Trông cứng nhắc, thiếu lãng mạn','Trông an toàn, giống mọi cô dâu khác']}
  ];
  var QZ_KIEU = [
    {ten:'Thanh lịch tối giản', mo:'Satin trơn, phom suông hoặc chữ A ít chi tiết — cái đẹp nằm ở đường cắt. Trong buổi thử, bạn hãy bắt đầu từ giá váy satin trơn.'},
    {ten:'Công chúa lộng lẫy', mo:'Ballgown tùng xoè, đính kết lấp lánh, voan dài phía sau. Trong buổi thử, bạn hãy bắt đầu từ những mẫu tùng xoè.'},
    {ten:'Mộng mơ bay bổng', mo:'Voan, organza nhiều lớp nhẹ như mây, tay voan mỏng. Trong buổi thử, bạn hãy bắt đầu từ những mẫu chất liệu bay.'},
    {ten:'Quyến rũ hiện đại', mo:'Đuôi cá ôm dáng, ren xuyên thấu, lưng khoét sâu. Trong buổi thử, bạn hãy bắt đầu từ những mẫu ôm dáng.'}
  ];
  var qzChon = [];
  function qzVe(){
    var ds = document.getElementById('qz-danh-sach');
    ds.innerHTML = '';
    QZ.forEach(function(cau, i){
      var khoi = document.createElement('div'); khoi.className = 'qz-cau';
      var b = document.createElement('b'); b.textContent = cau.q; khoi.appendChild(b);
      var dap = document.createElement('div'); dap.className = 'qz-dap';
      cau.a.forEach(function(chu, j){
        var nut = document.createElement('button');
        nut.innerHTML = '<i>' + 'ABCD'[j] + '</i><span></span>';
        nut.querySelector('span').textContent = chu;
        if (qzChon[i] === j) nut.classList.add('chon');
        nut.addEventListener('click', function(){ qzChon[i] = j; qzVe(); qzKetQua(); });
        dap.appendChild(nut);
      });
      khoi.appendChild(dap); ds.appendChild(khoi);
    });
  }
  function qzKetQua(){
    var kq = document.getElementById('qz-kq');
    var lamLai = document.getElementById('qz-lam-lai');
    var du = QZ.every(function(_, i){ return typeof qzChon[i] === 'number'; });
    if (!du){ kq.hidden = true; lamLai.hidden = true; return; }
    var dem = [0,0,0,0];
    qzChon.forEach(function(j){ dem[j]++; });
    var max = Math.max.apply(null, dem);
    var thang = [];
    dem.forEach(function(so, j){ if (so === max) thang.push(j); });
    var chu;
    if (thang.length === 1){
      var k = QZ_KIEU[thang[0]];
      chu = '<span class="nhan-h">Kết quả của bạn</span><h4>Bạn là cô dâu ' + k.ten + '</h4>' + k.mo;
    } else {
      var ten = thang.map(function(j){ return QZ_KIEU[j].ten; }).join(' và ');
      chu = '<span class="nhan-h">Kết quả của bạn</span><h4>Bạn là sự pha trộn: ' + ten + '</h4>'
          + 'Hai hướng đều là bạn — cứ mang cả hai vào buổi thử, mặc lên rồi cơ thể sẽ tự chọn giúp bạn.';
    }
    chu += '<br><br>Bạn chụp màn hình kết quả này gửi Dolinhanh trước buổi thử nhé — shop sẽ treo sẵn những mẫu đúng gu của bạn.';
    kq.innerHTML = chu; kq.hidden = false; lamLai.hidden = false;
    kq.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  function moQuiz(){
    qzVe(); qzKetQua();
    QZ_NEN.classList.add('hien');
  }
  document.getElementById('qz-dong').addEventListener('click', function(){ QZ_NEN.classList.remove('hien'); });
  QZ_NEN.addEventListener('click', function(e){ if (e.target === QZ_NEN) QZ_NEN.classList.remove('hien'); });
  document.getElementById('qz-lam-lai').addEventListener('click', function(){ qzChon = []; qzVe(); qzKetQua(); });

  function hai(n){ return n < 10 ? '0' + n : '' + n; }

  /* chỉ tải ảnh của mấy tờ quanh chỗ đang đọc — ảnh nét mà vẫn nhẹ */
  function taiAnh(el){
    if (!el) return;
    [].slice.call(el.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src = im.getAttribute('data-src');
      im.removeAttribute('data-src');
    });
  }
  function taiQuanh(){
    if (mot){
      for (var q = p - 1; q <= p + 2; q++){
        if (q >= 0 && q < N && ANH[q]) { var tam = new Image(); tam.src = ANH[q]; }
      }
      return;
    }
    for (var k = vi - 2; k <= vi + 3; k++) if (k >= 0 && k < SO_TO) taiAnh(to[k]);
  }

  function ve(){
    taiQuanh();
    if (mot){
      anhDon.src = ANH[p];
      var lop = document.getElementById('don');
      [].slice.call(lop.querySelectorAll('.diem')).forEach(function(x){ x.remove(); });
      datDiem(lop, p + 1);
      chiSo.textContent = p === 0 ? 'Bìa' : hai(p + 1);
      vach.style.width = Math.round((p + 1) / N * 100) + '%';
      bLui.disabled = p === 0;
      bToi.disabled = p >= N - 1;
      return;
    }
    to.forEach(function(el, k){
      var daLat = k < vi;
      var sau = (daLat ? (k + 1) : (SO_TO - k)) * 0.6;
      el.classList.toggle('lat', daLat);
      el.style.transform = 'translateZ(' + sau + 'px)' + (daLat ? ' rotateY(-180deg)' : '');
    });
    var trai = vi === 0 ? 0 : 2 * vi;
    var phai = vi < SO_TO ? 2 * vi + 1 : 0;
    chiSo.textContent = vi === 0 ? 'Bìa'
      : (phai && phai <= N ? hai(trai) + ' – ' + hai(phai) : hai(trai));
    vach.style.width = Math.round(vi / SO_TO * 100) + '%';
    bLui.disabled = vi === 0;
    bToi.disabled = vi >= SO_TO;
  }

  function di(buoc){
    if (mot){
      var q = Math.min(N - 1, Math.max(0, p + buoc));
      if (q === p) return;
      anhDon.style.opacity = 0;
      p = q;
      setTimeout(function(){ ve(); anhDon.style.opacity = 1; }, 140);
      return;
    }
    var moi = Math.min(SO_TO, Math.max(0, vi + buoc));
    if (moi === vi) return;
    vi = moi;
    ve();
  }

  function doCo(){
    var san = document.querySelector('.san');
    var cs = getComputedStyle(san);
    var demTrai = parseFloat(cs.paddingLeft) || 0, demPhai = parseFloat(cs.paddingRight) || 0;
    var cao = (san.clientHeight || window.innerHeight - 130) - 18;
    var rong = (san.clientWidth || window.innerWidth) - demTrai - demPhai - 6;
    if (cao < 120) cao = Math.max(240, window.innerHeight - 130);
    if (rong < 120) rong = Math.max(280, window.innerWidth - 24);
    var moi = window.innerWidth <= 700;
    if (moi !== mot){
      /* đổi chế độ thì giữ đúng trang đang đọc */
      if (moi) p = vi === 0 ? 0 : 2 * vi - 1;
      else vi = Math.floor((p + 1) / 2);
      mot = moi;
      document.body.classList.toggle('mot', mot);
    }
    var pw = cao / TI;
    var canRong = mot ? pw : pw * 2;
    if (canRong > rong){ pw = mot ? rong : rong / 2; }
    var ph = pw * TI;
    sach.style.width = (pw * 2) + 'px';
    sach.style.height = ph + 'px';
    don.style.width = pw + 'px';
    don.style.height = ph + 'px';
    khung.style.width = (mot ? pw : pw * 2) + 'px';
    khung.style.height = ph + 'px';
    ve();
  }

  bToi.addEventListener('click', function(e){ e.stopPropagation(); di(1); });
  bLui.addEventListener('click', function(e){ e.stopPropagation(); di(-1); });
  khung.addEventListener('click', function(e){
    if (e.target.closest('.mui') || e.target.closest('.diem')) return;
    if (mot){ moPhong(p); return; }          /* điện thoại: chạm để phóng to đọc */
    var r = khung.getBoundingClientRect();
    di(e.clientX - r.left > r.width / 2 ? 1 : -1);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') di(1);
    else if (e.key === 'ArrowLeft') di(-1);
    else if (e.key === 'Escape'){ luoi.classList.remove('hien'); hopNen.classList.remove('hien');
      phong.classList.remove('hien'); }
  });

  var x0 = null;
  khung.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  khung.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var d = e.changedTouches[0].clientX - x0;
    if (Math.abs(d) > 42) di(d < 0 ? 1 : -1);
    x0 = null;
  }, {passive:true});

  /* bảng ảnh nhỏ */
  var luoi = document.getElementById('luoi');
  var oLuoi = document.getElementById('o-luoi');
  ANH.forEach(function(src, i){
    var b = document.createElement('button');
    b.className = 'trang';
    b.innerHTML = '<img loading="lazy" src="' + src + '" alt=""><span>' + hai(i + 1) + '</span>';
    b.addEventListener('click', function(){
      if (mot) p = i; else vi = Math.floor((i + 1) / 2);
      luoi.classList.remove('hien');
      ve();
    });
    oLuoi.appendChild(b);
  });
  document.getElementById('nut-luoi').addEventListener('click', function(){ luoi.classList.add('hien'); });
  document.getElementById('dong-luoi').addEventListener('click', function(){ luoi.classList.remove('hien'); });

  document.getElementById('nut-to').addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });

  document.addEventListener('contextmenu', function(e){
    if (e.target.closest('.sach, .don, .luoi')) e.preventDefault();
  });
  document.getElementById('tong').textContent = N + ' trang';
  setTimeout(nhacGoiY, 900);
  if (DIEM.length) document.getElementById('chu-thich').classList.add('hien');
  var goiY = document.getElementById('goi-y');
  function nhacGoiY(){
    if (!mot || !goiY) return;
    goiY.classList.add('hien');
    setTimeout(function(){ goiY.classList.remove('hien'); }, 4200);
  }
  window.addEventListener('resize', doCo);
  window.addEventListener('load', doCo);
  window.addEventListener('orientationchange', doCo);
  if (window.ResizeObserver) new ResizeObserver(doCo).observe(document.querySelector('.san'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(doCo);
  setTimeout(doCo, 60); setTimeout(doCo, 400);
  doCo();
})();
</script>

</body>
</html>
