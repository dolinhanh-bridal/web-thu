<style>
  :root{
    --nen:#EFE9E5;
    --vien:#DFD5D0;
    --muc:#241B19;

  *{box-sizing:border-box}
  body{

  .luoi .o{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
  .luoi button.trang{

    display:grid;transition:transform .18s,border-color .2s;
  }
  .luoi button.trang:hover{transform:translateY(-3px);border-color:var(--hong-chu)}
  .luoi button.trang img{width:100%;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
  .luoi button.trang span{font-size:.58rem;letter-spacing:.14em;color:var(--ghi);padding:5px 0;background:var(--nen)}


  /* ── điểm bấm trên trang ────────────────────────────── */
  .diem{
    position:absolute;border:0;padding:0;cursor:pointer;background:rgba(240,189,184,.26);
    border-bottom:1.5px solid var(--hong-chu);border-radius:2px;z-index:8;
  }
  .diem:hover{background:rgba(240,189,184,.55)}
  .chu-thich{
    display:none;align-items:center;gap:7px;font-size:.64rem;letter-spacing:.1em;

  }
  .chu-thich.hien{display:inline-flex}
  @media(max-width:700px){#tong{display:none}.duoi{gap:12px}}
  .chu-thich i{width:22px;height:9px;border-radius:2px;background:rgba(240,189,184,.5);border-bottom:1.5px solid var(--hong-chu)}
  .diem:focus-visible{outline:2px solid var(--hong-chu);outline-offset:2px}

  .hop-nen{
    position:fixed;inset:0;z-index:120;background:rgba(36,27,25,.55);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .hop-nen.hien{display:flex}
  .hop-noi{
    background:#fff;color:#241B19;border-radius:14px;max-width:680px;width:100%;
    max-height:88vh;overflow-y:auto;padding:clamp(20px,3vw,30px);position:relative;
    box-shadow:0 24px 60px rgba(36,27,25,.3);
  }
  .hop-noi img{width:100%;height:auto;border-radius:8px;margin-bottom:18px;display:block}
  .hop-noi .nhan-h{font-family:var(--sans);font-size:.62rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#B05A55}
  .hop-noi h3{margin:6px 0 0;font-family:var(--serif);font-weight:400;font-size:1.32rem;color:#241B19}
  .hop-noi p{margin:12px 0 0;font-size:.94rem;line-height:1.7;color:#4C3E3B}
  .hop-noi .di-trang{
    margin-top:18px;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;
    background:#F0BDB8;color:#241B19;font-family:var(--sans);font-size:.7rem;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;padding:11px 20px;border-radius:999px;
  }
  .hop-dong{
    position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
    border:1px solid #EEDFDB;background:#fff;color:#241B19;cursor:pointer;font-size:14px;line-height:1;
  }

  /* ── đọc to: phóng trang để đọc trên điện thoại ────── */
  .phong{position:fixed;inset:0;z-index:140;background:#fff;display:none;flex-direction:column}
  .phong.hien{display:flex}
  .phong-cuon{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#EFE9E5}
  .phong-cuon img{display:block;margin:0 auto;max-width:none;height:auto}
  .phong-thanh{
    flex:none;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;
    border-top:1px solid var(--vien);
  }
  .phong-thanh button{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--vien);background:#fff;
    color:var(--muc);font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;
    font-family:var(--sans);
  }
  .phong-thanh button:disabled{opacity:.3}
  .phong-thanh .so{font-family:var(--serif);font-size:1rem;min-width:64px;text-align:center;color:var(--muc)}
  .phong-thanh .dong{background:var(--hong);border-color:var(--hong)}
  .goi-y{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:70;
    background:rgba(36,27,25,.82);color:#fff;font-size:.68rem;letter-spacing:.08em;
    padding:7px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity .4s;
  }
  .goi-y.hien{opacity:1}
  @media(prefers-reduced-motion:reduce){.to{transition:none}}
</style>

    } else { nut.hidden = true; }
    hopNen.classList.add('hien');
  }
  function datDiem(el, soTrang){
    DIEM.filter(function(d){ return d.p === soTrang; }).forEach(function(d){
      var b = document.createElement('button');
      b.className = 'diem';
      b.style.cssText = 'left:' + (d.x*100) + '%;top:' + (d.y*100) + '%;width:' + (d.w*100) + '%;height:' + (d.h*100) + '%';
      b.setAttribute('aria-label', d.ten);
      b.addEventListener('click', function(e){ e.stopPropagation(); moHop(d); });
      el.appendChild(b);
    });
  }
  to.forEach(function(el, k){
    var truoc = el.querySelector('.mat.truoc');
    datDauMo(truoc);
    datDiem(truoc, 2*k + 1);
    var sau = el.querySelector('.mat.sau');
    if (sau && sau.querySelector('img')){ datDauMo(sau); datDiem(sau, 2*k + 2); }
  });
  datDauMo(document.getElementById('don'));
  /* ── đọc to ── */
  var phong = document.getElementById('phong');
  var phCuon = document.getElementById('phong-cuon');
  var phAnh = document.getElementById('phong-anh');
  var mucPhong = [1, 1.6, 2.4, 3.4], iPhong = 1, trangPhong = 0;

  function veoPhong(){
    var w = phCuon.clientWidth || window.innerWidth;
    phAnh.style.width = Math.round(w * mucPhong[iPhong]) + 'px';
    document.getElementById('ph-so').textContent = trangPhong === 0 ? 'Bìa' : hai(trangPhong + 1);
    document.getElementById('ph-lui').disabled = trangPhong === 0;
    document.getElementById('ph-toi').disabled = trangPhong >= N - 1;
    document.getElementById('ph-nho').disabled = iPhong === 0;
    document.getElementById('ph-to').disabled = iPhong === mucPhong.length - 1;
  }
  function moPhong(t){
    trangPhong = Math.max(0, Math.min(N - 1, t));
    phAnh.src = ANH[trangPhong];
    phong.classList.add('hien');
    /* chọn mức phóng sao cho trang rộng khoảng 900px — cỡ chữ đọc thoải mái */
    var w = phCuon.clientWidth || window.innerWidth;
    iPhong = 0;
    while (iPhong < mucPhong.length - 1 && w * mucPhong[iPhong] < 900) iPhong++;
    veoPhong();
    phCuon.scrollTop = 0; phCuon.scrollLeft = 0;
  }
  function diPhong(b){
    var t = Math.max(0, Math.min(N - 1, trangPhong + b));
    if (t === trangPhong) return;
    trangPhong = t; phAnh.src = ANH[t]; veoPhong(); phCuon.scrollTop = 0;
  }
  document.getElementById('nut-doc').addEventListener('click', function(){
    moPhong(mot ? p : (vi === 0 ? 0 : 2 * vi));
  });
  document.getElementById('ph-dong').addEventListener('click', function(){
    phong.classList.remove('hien');
    if (mot) { p = trangPhong; } else { vi = Math.floor((trangPhong + 1) / 2); }
    ve();
  });
  document.getElementById('ph-lui').addEventListener('click', function(){ diPhong(-1); });
  document.getElementById('ph-toi').addEventListener('click', function(){ diPhong(1); });
  document.getElementById('ph-to').addEventListener('click', function(){
    if (iPhong < mucPhong.length - 1){ iPhong++; veoPhong(); } });
  document.getElementById('ph-nho').addEventListener('click', function(){
    if (iPhong > 0){ iPhong--; veoPhong(); } });
  window.addEventListener('resize', function(){ if (phong.classList.contains('hien')) veoPhong(); });

  document.getElementById('hop-dong').addEventListener('click', function(){ hopNen.classList.remove('hien'); });
  hopNen.addEventListener('click', function(e){ if (e.target === hopNen) hopNen.classList.remove('hien'); });

  function hai(n){ return n < 10 ? '0' + n : '' + n; }

  /* chỉ tải ảnh của mấy tờ quanh chỗ đang đọc — ảnh nét mà vẫn nhẹ */
  function taiAnh(el){
    if (!el) return;
    [].slice.call(el.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src = im.getAttribute('data-src');
      im.removeAttribute('data-src');
    });
  }
  function taiQuanh(){
    if (mot){
      for (var q = p - 1; q <= p + 2; q++){
        if (q >= 0 && q < N && ANH[q]) { var tam = new Image(); tam.src = ANH[q]; }
      }
      return;
    }
    for (var k = vi - 2; k <= vi + 3; k++) if (k >= 0 && k < SO_TO) taiAnh(to[k]);
  }

  function ve(){
    taiQuanh();
    if (mot){
      anhDon.src = ANH[p];
      var lop = document.getElementById('don');
      [].slice.call(lop.querySelectorAll('.diem')).forEach(function(x){ x.remove(); });
      datDiem(lop, p + 1);
      chiSo.textContent = p === 0 ? 'Bìa' : hai(p + 1);
      vach.style.width = Math.round((p + 1) / N * 100) + '%';
      bLui.disabled = p === 0;
      bToi.disabled = p >= N - 1;
      return;
    }
    to.forEach(function(el, k){
      var daLat = k < vi;
      var sau = (daLat ? (k + 1) : (SO_TO - k)) * 0.6;
      el.classList.toggle('lat', daLat);
      el.style.transform = 'translateZ(' + sau + 'px)' + (daLat ? ' rotateY(-180deg)' : '');
    });
    var trai = vi === 0 ? 0 : 2 * vi;
    var phai = vi < SO_TO ? 2 * vi + 1 : 0;
    chiSo.textContent = vi === 0 ? 'Bìa'
      : (phai && phai <= N ? hai(trai) + ' – ' + hai(phai) : hai(trai));
    vach.style.width = Math.round(vi / SO_TO * 100) + '%';
    bLui.disabled = vi === 0;
    bToi.disabled = vi >= SO_TO;
  }

  function di(buoc){
    if (mot){
      var q = Math.min(N - 1, Math.max(0, p + buoc));
      if (q === p) return;
      anhDon.style.opacity = 0;
      p = q;
      setTimeout(function(){ ve(); anhDon.style.opacity = 1; }, 140);
      return;
    }
    var moi = Math.min(SO_TO, Math.max(0, vi + buoc));
    if (moi === vi) return;
    vi = moi;
    ve();
  }

  function doCo(){
    var san = document.querySelector('.san');
    var cs = getComputedStyle(san);
    var demTrai = parseFloat(cs.paddingLeft) || 0, demPhai = parseFloat(cs.paddingRight) || 0;
    var cao = (san.clientHeight || window.innerHeight - 130) - 18;
    var rong = (san.clientWidth || window.innerWidth) - demTrai - demPhai - 6;
    if (cao < 120) cao = Math.max(240, window.innerHeight - 130);
    if (rong < 120) rong = Math.max(280, window.innerWidth - 24);
    var moi = window.innerWidth <= 700;
    if (moi !== mot){
      /* đổi chế độ thì giữ đúng trang đang đọc */
      if (moi) p = vi === 0 ? 0 : 2 * vi - 1;
      else vi = Math.floor((p + 1) / 2);
      mot = moi;
      document.body.classList.toggle('mot', mot);
    }
    var pw = cao / TI;
    var canRong = mot ? pw : pw * 2;
    if (canRong > rong){ pw = mot ? rong : rong / 2; }
    var ph = pw * TI;
    sach.style.width = (pw * 2) + 'px';
    sach.style.height = ph + 'px';
    don.style.width = pw + 'px';
    don.style.height = ph + 'px';
    khung.style.width = (mot ? pw : pw * 2) + 'px';
    khung.style.height = ph + 'px';
    ve();
  }

  bToi.addEventListener('click', function(e){ e.stopPropagation(); di(1); });
  bLui.addEventListener('click', function(e){ e.stopPropagation(); di(-1); });
  khung.addEventListener('click', function(e){
    if (e.target.closest('.mui') || e.target.closest('.diem')) return;
    if (mot){ moPhong(p); return; }          /* điện thoại: chạm để phóng to đọc */
    var r = khung.getBoundingClientRect();
    di(e.clientX - r.left > r.width / 2 ? 1 : -1);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') di(1);
    else if (e.key === 'ArrowLeft') di(-1);
    else if (e.key === 'Escape'){ luoi.classList.remove('hien'); hopNen.classList.remove('hien');
      phong.classList.remove('hien'); }
  });

  var x0 = null;
  khung.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  khung.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var d = e.changedTouches[0].clientX - x0;
    if (Math.abs(d) > 42) di(d < 0 ? 1 : -1);
    x0 = null;
  }, {passive:true});

  /* bảng ảnh nhỏ */
  var luoi = document.getElementById('luoi');
  var oLuoi = document.getElementById('o-luoi');
  ANH.forEach(function(src, i){
    var b = document.createElement('button');
    b.className = 'trang';
    b.innerHTML = '<img loading="lazy" src="' + src + '" alt=""><span>' + hai(i + 1) + '</span>';
    b.addEventListener('click', function(){
      if (mot) p = i; else vi = Math.floor((i + 1) / 2);
      luoi.classList.remove('hien');
      ve();
    });
    oLuoi.appendChild(b);
  });
  document.getElementById('nut-luoi').addEventListener('click', function(){ luoi.classList.add('hien'); });
  document.getElementById('dong-luoi').addEventListener('click', function(){ luoi.classList.remove('hien'); });

  document.getElementById('nut-to').addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });

  document.addEventListener('contextmenu', function(e){
    if (e.target.closest('.sach, .don, .luoi')) e.preventDefault();
  });
  document.getElementById('tong').textContent = N + ' trang';
  setTimeout(nhacGoiY, 900);
  if (DIEM.length) document.getElementById('chu-thich').classList.add('hien');
  var goiY = document.getElementById('goi-y');
  function nhacGoiY(){
    if (!mot || !goiY) return;
    goiY.classList.add('hien');
    setTimeout(function(){ goiY.classList.remove('hien'); }, 4200);
  }
  window.addEventListener('resize', doCo);
  window.addEventListener('load', doCo);
  window.addEventListener('orientationchange', doCo);
  if (window.ResizeObserver) new ResizeObserver(doCo).observe(document.querySelector('.san'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(doCo);
  setTimeout(doCo, 60); setTimeout(doCo, 400);
  doCo();
})();
</script>

</body>
</html>
